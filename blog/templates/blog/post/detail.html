{% extends 'blog/base.html' %}

{% block title %}{{ post.title }}{% endblock %}

{% block content %}
<h1>{{ post.title }}</h1>
<p class="date">
    Published {{ post.publish }} by {{ post.author }}
</p>

{{ post.body | linebreaks }}

<a href="{% url 'blog:post_share' post.id %}" class="share-button">
    <i class="fas fa-share-alt"></i>
    Share this post
</a>


{% endblock %}
